# Dependabot: automated dependency and security updates (disabled: open-pull-requests-limit set to 0).
# https://docs.github.com/en/code-security/dependabot

version: 2
registries: {}

updates:
  # Node (API Worker)
  - package-ecosystem: npm
    directory: apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    # Add labels here after creating them in repo: Settings → Labels (e.g. dependencies, security)
    commit-message:
      prefix: deps(npm)

  # .NET (SimHub plugin)
  - package-ecosystem: nuget
    directory: apps/plugin/WinPodiums.Plugin
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: deps(nuget)

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci(actions)
