# CI: typecheck, lint, plugin build, lockfile check, OpenAPI validation.
# Workflow runs when api/plugin/docs-api change; each job runs only when its paths change.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/plugin/**"
      - "docs/api/**"
      - ".github/workflows/ci.yml"

jobs:
  paths:
    name: Paths filter
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      plugin: ${{ steps.filter.outputs.plugin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'docs/api/**'
              - '.github/workflows/ci.yml'
            plugin:
              - 'apps/plugin/**'
              - '.github/workflows/ci.yml'

  api-typecheck:
    needs: paths
    if: needs.paths.outputs.api == 'true'
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install and typecheck
        run: |
          npm ci
          node scripts/inline-openapi.js ../../docs/api/openapi.yaml src/openapi-spec.ts
          npm run typecheck

  api-lint:
    name: ESLint
    needs: paths
    if: needs.paths.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install and lint
        run: |
          npm ci
          node scripts/inline-openapi.js ../../docs/api/openapi.yaml src/openapi-spec.ts
          npm run lint

  plugin-build:
    name: Plugin build
    needs: paths
    if: needs.paths.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore and build
        run: |
          cd apps/plugin/WinPodiums.Plugin
          dotnet restore
          dotnet build --configuration Release --no-restore

  api-lockfile:
    name: Lockfile check
    needs: paths
    if: needs.paths.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install and verify lockfile
        run: npm ci
      - name: Verify lockfile unchanged
        run: git diff --exit-code apps/api/package-lock.json
        working-directory: ${{ github.workspace }}

  openapi-validate:
    name: OpenAPI validation
    needs: paths
    if: needs.paths.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate OpenAPI spec
        run: npx @stoplight/spectral-cli@latest lint docs/api/openapi.yaml --fail-severity=error
