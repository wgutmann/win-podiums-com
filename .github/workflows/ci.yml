# CI: TypeScript typecheck, ESLint, OpenAPI (Spectral).
# Runs when apps/api, docs/api, or this workflow change.
# See docs/guides/development.md#recommended-github-actions

name: CI

on:
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paths:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      ci_api: ${{ steps.filter.outputs.ci_api }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci_api:
              - 'apps/api/**'
              - 'docs/api/**'
              - '.github/workflows/ci.yml'

  ci:
    needs: paths
    if: needs.paths.outputs.ci_api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Inline OpenAPI
        working-directory: apps/api
        run: node scripts/inline-openapi.js ../../docs/api/openapi.yaml src/openapi-spec.ts

      - name: Typecheck
        working-directory: apps/api
        run: npm run typecheck

      - name: Lint
        working-directory: apps/api
        run: npm run lint

      - name: OpenAPI validation
        run: npx @stoplight/spectral-cli@latest lint docs/api/openapi.yaml --fail-severity=error --ruleset .spectral.yaml
