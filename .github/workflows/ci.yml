# CI: required checks first (each step reports as soon as it completes), then optional tests if all required pass.
# Required: typecheck, lint, lockfile, OpenAPI, required unit tests. Optional: optional unit tests.
# Workflow runs when api/plugin/docs-api change; each job runs only when its paths change.
# Concurrency cancels in-progress runs when new commits are pushed (saves minutes).
name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/plugin/**"
      - "docs/api/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/plugin/**"
      - "docs/api/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paths:
    name: Paths filter
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      plugin: ${{ steps.filter.outputs.plugin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'docs/api/**'
              - '.github/workflows/ci.yml'
            plugin:
              - 'apps/plugin/**'
              - '.github/workflows/ci.yml'

  api-validate:
    needs: paths
    if: needs.paths.outputs.api == 'true'
    name: API (required then optional tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install and inline OpenAPI
        run: |
          npm ci
          node scripts/inline-openapi.js ../../docs/api/openapi.yaml src/openapi-spec.ts

      # --- Required: each step reports as soon as it completes; job fails on first failure ---
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lockfile check
        run: git diff --exit-code apps/api/package-lock.json
        working-directory: ${{ github.workspace }}

      - name: OpenAPI validation
        run: npx @stoplight/spectral-cli@latest lint docs/api/openapi.yaml --fail-severity=error
        working-directory: ${{ github.workspace }}

      - name: Required unit tests
        run: npm run test:required

      # --- Optional: runs only if all required steps passed ---
      - name: Optional unit tests
        run: npm run test:optional

  plugin-build:
    name: Plugin build
    needs: paths
    if: needs.paths.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: "nuget"
          cache-dependency-path: apps/plugin/WinPodiums.Plugin/WinPodiums.Plugin.csproj

      - name: Restore and build
        run: |
          cd apps/plugin/WinPodiums.Plugin
          dotnet restore
          dotnet build --configuration Release --no-restore

