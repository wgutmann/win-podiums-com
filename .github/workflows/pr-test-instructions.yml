# On every PR, post or update a comment explaining how to run the tests required for merge
# that are NOT triggered automatically by GitHub Actions (e.g. Security).
# See docs/guides/testing-harness.md.
name: PR test instructions

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Comment how to run required tests
    runs-on: ubuntu-latest
    steps:
      - name: Find or create instructions comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-required-tests-instructions -->';
            const body = `## How to run tests required for merge

            The following checks are **required for merge** but **do not run automatically** on push or PR. You must trigger them manually.

            ### Security checks (required status: \`security-gate\`)

            **Option 1 — Comment on this PR**  
            Comment exactly:
            \`\`\`
            /run-security
            \`\`\`
            The Security workflow will run on this PR's branch and report status here.

            **Option 2 — Actions tab**  
            1. Open the **Actions** tab.  
            2. Select the **Security** workflow.  
            3. Click **Run workflow**, choose this PR's branch, then **Run workflow**.  
            4. The run will appear as a status check on this PR.

            After Security passes, the **security-gate** check will be satisfied and you can merge (if branch protection is configured to require it).

            ${marker}`;

            const prNumber = context.payload.pull_request.number;
            const repo = context.repo;
            const octokit = github.rest;

            const { data: comments } = await octokit.issues.listComments({
              ...repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body && c.body.includes(marker)
            );

            if (botComment) {
              await octokit.issues.updateComment({
                ...repo,
                comment_id: botComment.id,
                body,
              });
              console.log('Updated existing instructions comment');
            } else {
              await octokit.issues.createComment({
                ...repo,
                issue_number: prNumber,
                body,
              });
              console.log('Created new instructions comment');
            }
