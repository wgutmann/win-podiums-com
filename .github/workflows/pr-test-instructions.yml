# On every PR, post or update a comment with instructions for re-running Security if needed.
# CI and Security run automatically on PR (path-filtered); this comment explains manual re-run.
# See docs/guides/testing-harness.md.
name: PR test instructions

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Comment how to run required tests
    runs-on: ubuntu-latest
    steps:
      - name: Find or create instructions comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-required-tests-instructions -->';
            const body = `## Tests required for merge

            **CI** and **Security** run automatically on this PR when \`apps/api\`, \`apps/plugin\`, or \`docs/api\` change. Wait for the checks to finish; when they pass, you can merge (if branch protection is satisfied).

            ### Re-run Security manually

            To re-run Security without pushing a new commit:

            **Option 1 — Comment on this PR**  
            Comment: \`/run-security\`

            **Option 2 — Actions tab**  
            Actions → **Security** → **Run workflow**, choose this PR's branch → **Run workflow**.

            ${marker}`;

            const prNumber = context.payload.pull_request.number;
            const repo = context.repo;
            const octokit = github.rest;

            const { data: comments } = await octokit.issues.listComments({
              ...repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body && c.body.includes(marker)
            );

            if (botComment) {
              await octokit.issues.updateComment({
                ...repo,
                comment_id: botComment.id,
                body,
              });
              console.log('Updated existing instructions comment');
            } else {
              await octokit.issues.createComment({
                ...repo,
                issue_number: prNumber,
                body,
              });
              console.log('Created new instructions comment');
            }
