# Security: secret scanning, dependency audits, and code scanning (SAST).
# Runs on push to main and on pull requests; blocks merge if critical issues are found.
# When any check fails on push to main, opens a PR to revert the offending commit (safety net).
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # --- Path filter: skip dependency/CodeQL jobs when only unrelated files change ---
  filter:
    name: Path filter
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.paths.outputs.api }}
      plugin: ${{ steps.paths.outputs.plugin }}
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            api:
              - 'apps/api/package.json'
              - 'apps/api/package-lock.json'
            plugin:
              - 'apps/plugin/**/*.csproj'
              - 'apps/plugin/**/packages.lock.json'
            code:
              - 'apps/api/**'
              - 'apps/plugin/**'

  # --- Secret scanning (commits and working tree) ---
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog (secrets)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  # --- Dependency vulnerability checks ---
  deps-npm:
    name: npm audit
    runs-on: ubuntu-latest
    needs: [filter]
    if: needs.filter.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install and audit (API)
        run: |
          cd apps/api && npm ci
          npm audit --audit-level=high

  deps-dotnet:
    name: .NET vulnerable packages
    runs-on: ubuntu-latest
    needs: [filter]
    if: needs.filter.outputs.plugin == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
          cache: "nuget"
          cache-dependency-path: apps/plugin/WinPodiums.Plugin/WinPodiums.Plugin.csproj

      - name: Restore and list vulnerable packages
        run: |
          cd apps/plugin/WinPodiums.Plugin
          dotnet restore
          OUT=$(dotnet list package --vulnerable --include-transitive 2>&1) || true
          echo "$OUT"
          # Fail only when dotnet reports that vulnerabilities exist (not on "has no vulnerable packages")
          if echo "$OUT" | grep -qE "has the following vulnerable|following package.*have known vulnerabilities"; then
            echo "::error::Vulnerable NuGet package(s) found. Update or remove them."
            exit 1
          fi

  # --- Code scanning (SAST) with CodeQL ---
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    needs: [filter]
    if: needs.filter.outputs.code == 'true'
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, csharp]
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Build C# project
        if: matrix.language == 'csharp'
        run: |
          cd apps/plugin/WinPodiums.Plugin
          dotnet build --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # --- Revert PR when any security check fails on push to main ---
  revert-on-failure:
    name: Open revert PR
    runs-on: ubuntu-latest
    needs: [secrets, deps-npm, deps-dotnet, codeql]
    if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create revert branch and commit
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${FULL_SHA:0:7}"
          BRANCH="revert-security-${SHORT_SHA}"
          git checkout -b "$BRANCH"
          git revert --no-edit "$FULL_SHA"
          git push origin "$BRANCH"

      - name: Open revert PR
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${FULL_SHA:0:7}"
          BRANCH="revert-security-${SHORT_SHA}"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Revert: security check failed (${SHORT_SHA::7})" \
            --body "One or more security checks failed on push to \`main\` (secret scan, dependency audit, or CodeQL). This PR reverts the offending commit.

**Commit reverted:** \`$SHORT_SHA\`

Please review the [Security workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details, fix the issue, and either merge this revert or close and push a fix."
