# Security: secret scanning, dependency audits, and code scanning (SAST).
# Runs on every PR (path-filtered) so branch protection required checks are reported.
# Also: workflow_dispatch ("Run workflow") and comment "/run-security" on a PR.
# See docs/guides/testing-harness.md.
name: Security

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/plugin/**"
      - "docs/api/**"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/plugin/**"
      - "docs/api/**"
      - ".github/workflows/security.yml"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run security on (default: workflow ref)"
        required: false
  issue_comment:
    types: [created]

concurrency:
  group: security-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

jobs:
  # --- Resolve ref to run on: PR head when triggered by /run-security comment, else workflow ref ---
  get-ref:
    name: Get ref
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ref: ${{ steps.set-ref.outputs.ref }}
      skip: ${{ steps.set-ref.outputs.skip }}
      is_main: ${{ steps.set-ref.outputs.is_main }}
    steps:
      - name: Set ref and skip
        id: set-ref
        run: |
          REF="${{ github.sha }}"
          SKIP="false"
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            BODY="${{ github.event.comment.body }}"
            HAS_PULL_REQUEST="${{ github.event.issue.pull_request }}"
            if [ -z "$HAS_PULL_REQUEST" ] || ! echo "$BODY" | grep -qiE '/run-security'; then
              REF="${{ github.sha }}"
              SKIP="true"
              echo "ref=$REF" >> $GITHUB_OUTPUT
              echo "skip=$SKIP" >> $GITHUB_OUTPUT
              echo "is_main=false" >> $GITHUB_OUTPUT
              echo "Skipping: not a PR or comment does not contain /run-security"
              exit 0
            else
              REF=$(gh pr view "${{ github.event.issue.number }}" --json headRefOid -q .headRefOid)
              echo "Running security on PR head: $REF"
            fi
          fi
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "skip=$SKIP" >> $GITHUB_OUTPUT
          # For revert-on-failure: only revert when the ref we ran on is main
          MAIN_SHA=$(gh api repos/${{ github.repository }}/git/refs/heads/main -q .object.sha 2>/dev/null || echo "")
          if [ -n "$MAIN_SHA" ] && [ "$REF" = "$MAIN_SHA" ]; then
            echo "is_main=true" >> $GITHUB_OUTPUT
          else
            echo "is_main=false" >> $GITHUB_OUTPUT
          fi

  # --- Path filter: skip dependency/CodeQL jobs when only unrelated files change ---
  filter:
    name: Path filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [get-ref]
    if: needs.get-ref.outputs.skip != 'true'
    outputs:
      api: ${{ steps.paths.outputs.api }}
      plugin: ${{ steps.paths.outputs.plugin }}
      code: ${{ steps.paths.outputs.code }}
      codeql_languages: ${{ steps.codeql-languages.outputs.codeql_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.get-ref.outputs.ref }}
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            api:
              - 'apps/api/package.json'
              - 'apps/api/package-lock.json'
            plugin:
              - 'apps/plugin/**/*.csproj'
              - 'apps/plugin/**/packages.lock.json'
            code:
              - 'apps/api/**'
              - 'apps/plugin/**'
            api_code:
              - 'apps/api/**'
            plugin_code:
              - 'apps/plugin/**'

      - id: codeql-languages
        run: |
          A="${{ steps.paths.outputs.api_code }}"
          P="${{ steps.paths.outputs.plugin_code }}"
          if [ "$A" = "true" ] && [ "$P" = "true" ]; then
            echo "codeql_languages=[\"javascript-typescript\",\"csharp\"]" >> $GITHUB_OUTPUT
          elif [ "$A" = "true" ]; then
            echo "codeql_languages=[\"javascript-typescript\"]" >> $GITHUB_OUTPUT
          elif [ "$P" = "true" ]; then
            echo "codeql_languages=[\"csharp\"]" >> $GITHUB_OUTPUT
          else
            echo "codeql_languages=[]" >> $GITHUB_OUTPUT
          fi

  # --- Secret scanning (commits and working tree) ---
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [get-ref]
    if: needs.get-ref.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.get-ref.outputs.ref }}
          fetch-depth: 0

      - name: TruffleHog (secrets)
        uses: trufflesecurity/trufflehog@v3.92.5
        with:
          path: ./
          extra_args: --only-verified

  # --- Dependency vulnerability checks ---
  deps-npm:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [get-ref, filter]
    if: needs.get-ref.outputs.skip != 'true' && needs.filter.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.get-ref.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install and audit (API)
        run: |
          cd apps/api && npm ci
          npm audit --audit-level=high

  deps-dotnet:
    name: .NET vulnerable packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [get-ref, filter]
    if: needs.get-ref.outputs.skip != 'true' && needs.filter.outputs.plugin == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.get-ref.outputs.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
          cache: "nuget"
          cache-dependency-path: apps/plugin/WinPodiums.Plugin/WinPodiums.Plugin.csproj

      - name: Restore and list vulnerable packages
        run: |
          cd apps/plugin/WinPodiums.Plugin
          dotnet restore
          OUT=$(dotnet list package --vulnerable --include-transitive 2>&1) || true
          echo "$OUT"
          # Fail only when dotnet reports that vulnerabilities exist (not on "has no vulnerable packages")
          if echo "$OUT" | grep -qE "has the following vulnerable|following package.*have known vulnerabilities"; then
            echo "::error::Vulnerable NuGet package(s) found. Update or remove them."
            exit 1
          fi

  # --- Code scanning (SAST) with CodeQL (skipped on draft PRs to save minutes) ---
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [get-ref, filter]
    if: needs.get-ref.outputs.skip != 'true' && needs.filter.outputs.code == 'true' && needs.filter.outputs.codeql_languages != '[]'
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.filter.outputs.codeql_languages) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.get-ref.outputs.ref }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Build C# project
        if: matrix.language == 'csharp'
        run: |
          cd apps/plugin/WinPodiums.Plugin
          dotnet build --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # --- Gate for branch protection: require this job to pass before merge ---
  security-gate:
    name: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [get-ref, secrets, deps-npm, deps-dotnet, codeql]
    if: needs.get-ref.outputs.skip != 'true'
    steps:
      - name: All security checks passed
        run: echo "Security checks passed. Use this status for branch protection (Security / security-gate)."

  # --- Revert PR when security fails on main (e.g. workflow_dispatch on main) ---
  revert-on-failure:
    name: Open revert PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [get-ref, secrets, deps-npm, deps-dotnet, codeql]
    if: failure() && needs.get-ref.outputs.is_main == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create revert branch and commit
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${FULL_SHA:0:7}"
          BRANCH="revert-security-${SHORT_SHA}"
          git checkout -b "$BRANCH"
          git revert --no-edit "$FULL_SHA"
          git push origin "$BRANCH"

      - name: Open revert PR
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${FULL_SHA:0:7}"
          BRANCH="revert-security-${SHORT_SHA}"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Revert: security check failed (${SHORT_SHA::7})" \
            --body "One or more security checks failed on push to \`main\` (secret scan, dependency audit, or CodeQL). This PR reverts the offending commit.

**Commit reverted:** \`$SHORT_SHA\`

Please review the [Security workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details, fix the issue, and either merge this revert or close and push a fix."
