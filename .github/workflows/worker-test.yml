# Worker test: required (unit tests) run first; optional (smoke test) runs only after required pass.
# Workflow runs on every push/PR to main; test job runs only when api/Docker paths change.
name: Worker test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: worker-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paths:
    name: Path filter
    runs-on: ubuntu-latest
    outputs:
      api_or_docker: ${{ steps.filters.outputs.api_or_docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filters
        with:
          filters: |
            api_or_docker:
              - 'apps/api/**'
              - 'Dockerfile'
              - 'compose.yaml'
              - '.github/workflows/worker-test.yml'

  test:
    needs: paths
    if: needs.paths.outputs.api_or_docker == 'true'
    name: Unit tests + Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create .dev.vars for CI
        run: |
          cp apps/api/.dev.vars.example apps/api/.dev.vars 2>/dev/null || true
          if [ ! -f apps/api/.dev.vars ]; then
            printf 'DISCORD_CLIENT_ID=\nDISCORD_CLIENT_SECRET=\nSESSION_SECRET=ci-placeholder-at-least-32-chars-here\n' > apps/api/.dev.vars
          fi

      - name: Build and start API (Docker)
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          docker compose up -d --build
          n=0
          until curl -sf http://localhost:8787/api/health >/dev/null; do
            n=$((n+1))
            [ $n -ge 30 ] && { echo "API did not become ready"; docker compose logs api; exit 1; }
            sleep 2
          done

      - name: Unit tests (required)
        run: docker compose exec -T api npm run test:unit

      - name: Setup Node for smoke test
        if: success()
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Smoke test (optional)
        if: success()
        run: node apps/api/test/smoke.js

      - name: Show API logs on failure
        if: failure()
        run: docker compose logs api
