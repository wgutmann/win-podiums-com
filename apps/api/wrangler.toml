# WinPodiums API — Cloudflare Worker (dev; same config for Docker and wrangler dev)
name = "winpodiums-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "dev"

# D1, R2, KV: bindings for local dev (wrangler dev / Docker). For remote deploy, create resources in Cloudflare and set database_id / id as needed.
[[d1_databases]]
binding = "DB"
database_name = "winpodiums-dev-db"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "R2"
bucket_name = "winpodiums-dev-storage"

[[kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000000"
