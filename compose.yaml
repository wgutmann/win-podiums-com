# WinPodiums — Docker dev environment (API / Worker)
# Config matches apps/api/wrangler.toml (1:1). Run: docker compose up
# Build: docker compose build  |  Test: docker compose up -d && cd apps/api && npm test
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    volumes:
      # Live reload: mount source so edits reflect without rebuild
      - ./apps/api/src:/app/src
    environment:
      - ENVIRONMENT=dev
    # Secrets: same as Worker .dev.vars. Create apps/api/.dev.vars from apps/api/.dev.vars.example if missing. Do not commit.
    env_file:
      - ./apps/api/.dev.vars
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8787/api/health', (r) => { r.resume(); process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
