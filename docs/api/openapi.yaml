openapi: 3.0.3
info:
  title: WinPodiums API
  version: v1
  description: >
    REST API for WinPodiums, hosted on Cloudflare Workers. This OpenAPI
    specification documents the current endpoint surface area and shared
    response formats. As endpoints are implemented, update request/response
    schemas to match real payloads.
servers:
  - url: https://winpodiums.com/api
    description: Production
  - url: http://localhost:8787/api
    description: Local development (Wrangler)
tags:
  - name: System
    description: Health and operational endpoints
  - name: Authentication
    description: Discord OAuth2 flows and token handling
  - name: Plugin
    description: SimHub plugin integration endpoints
  - name: Profile
    description: User profile data and preferences
paths:
  /health:
    get:
      tags:
        - System
      summary: Health check
      description: Returns API health and environment. No auth required.
      responses:
        "200":
          description: API is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  env:
                    type: string
                    example: dev
                required:
                  - ok
  /auth/config:
    get:
      tags:
        - Authentication
      summary: Public auth config (plugin)
      description: Returns Discord client ID for plugin PKCE authorize URL. No auth required.
      responses:
        "200":
          description: Auth config.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      discordClientId:
                        type: string
                        description: Discord OAuth2 client ID (public).
                required:
                  - data
  /auth/discord/callback:
    post:
      tags:
        - Authentication
      summary: Web OAuth2 callback
      description: Handles Discord OAuth2 callback for web sessions.
      responses:
        "200":
          description: Successful authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/discord/exchange:
    post:
      tags:
        - Authentication
      summary: Plugin token exchange (PKCE)
      description: Exchanges a plugin PKCE code for an access token.
      responses:
        "200":
          description: Token exchange success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/qr-status/{sessionId}:
    get:
      tags:
        - Authentication
      summary: QR code polling
      description: Polls for QR-based authentication status.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: QR status result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: >
        Exchanges the current (possibly expired) Bearer token for a new Discord access token.
        Used by the plugin when a protected call returns 401. Requires Authorization Bearer with
        the current Discord access token. Returns new access_token, expires_in, and discord_id.
        Does not return refresh_token.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Empty body optional
      responses:
        "200":
          description: New token issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        description: New Discord access token
                      expires_in:
                        type: integer
                        description: Seconds until access_token expires
                      discord_id:
                        type: string
                        description: User Discord ID
                    required:
                      - access_token
                      - expires_in
                      - discord_id
                required:
                  - success
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many refresh attempts. Include Retry-After header.
          headers:
            Retry-After:
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Discord unavailable or server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/token-exchange:
    post:
      tags:
        - Authentication
      summary: Manual token validation (debug only)
      description: Validates a manually provided token and returns session info. For plugin debugging only; not a user-facing auth option. Plugin must expose this flow only when a feature flag (e.g. debug mode) is enabled.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: One-time token from /auth/token-generate
      responses:
        "200":
          description: Token validation success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/token-generate:
    post:
      tags:
        - Authentication
      summary: Create one-time manual token (debug only)
      description: Creates a one-time token for the plugin. Used only when plugin manual-token auth is enabled (debug feature flag). Requires session cookie (web login) or Bearer token.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Token created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /plugin/verify:
    post:
      tags:
        - Plugin
      summary: Submit race result for verification
      description: Submits a telemetry payload for verification.
      responses:
        "200":
          description: Verification accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /plugin/heartbeat:
    post:
      tags:
        - Plugin
      summary: Plugin heartbeat
      description: Sends a plugin heartbeat to keep session active. Optional body with version.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: string
                  example: "1.0.0"
      responses:
        "200":
          description: Heartbeat accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /plugin/download/{type}:
    get:
      tags:
        - Plugin
      summary: Download plugin installer
      description: Downloads a plugin installer by type. Not yet implemented (returns 404).
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plugin installer download.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /profile/me:
    get:
      tags:
        - Profile
      summary: Current user's profile
      description: Returns the authenticated user's profile.
      responses:
        "200":
          description: Profile payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags:
        - Profile
      summary: Update user preferences
      description: Updates preferences for the authenticated user.
      responses:
        "200":
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /profile/{discordId}:
    get:
      tags:
        - Profile
      summary: Public profile
      description: Returns a public profile if enabled. Not yet implemented (returns 404).
      parameters:
        - name: discordId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public profile payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Discord access token (from /auth/discord/exchange or /auth/token-exchange)
    cookieAuth:
      type: apiKey
      in: cookie
      name: wp_session
      description: Session cookie set after web login at /auth/discord
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          additionalProperties: true
      required:
        - success
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: error_code_snake_case
        message:
          type: string
          example: Human-readable error message
        details:
          type: object
          additionalProperties: true
      required:
        - success
        - error
        - message
  responses:
    BadRequest:
      description: Invalid input or malformed request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid authorization token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource state conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
